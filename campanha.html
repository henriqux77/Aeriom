<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080707">
    <title>Aerion — Painel da Campanha</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/campanha.css">
</head>
<body>

<main class="campaign-dashboard">
    <header class="dash-header">
        <button id="backToCampaignsBtn" class="header-button" aria-label="Voltar">←</button>
        <div class="dash-title">
            <span id="campaignRoleLabel">Carregando...</span>
            <h1 id="campaignTitle">Painel da Campanha</h1>
        </div>
    </header>

    <div id="loadingDash" class="characters-message" style="margin-top: 50px;">
        <div class="characters-loader"></div>
        <p>Acessando o mundo...</p>
    </div>

    <section id="dashContent" class="dash-content" hidden>
        <!-- CABEÇALHO DA CAMPANHA -->
        <div class="campaign-banner" id="campaignBanner">
            <div class="banner-overlay"></div>
            <h2 id="bannerName">Nome da Campanha</h2>
        </div>

        <!-- ÁREA DO MESTRE -->
        <div id="masterPanel" class="dash-panel master-panel" hidden>
            <h3>Ferramentas do Mestre</h3>
            <div style="display: flex; gap: 10px; align-items: center; margin-top: 15px;">
                <button id="generateInviteBtn" class="primary-button" style="width: auto; min-height: 40px; font-size: 12px;">Gerar Convite</button>
                <div id="inviteCodeDisplay" style="padding: 10px 15px; border: 1px dashed var(--gold); border-radius: 8px; color: var(--gold); font-family: monospace; font-size: 16px; letter-spacing: 2px;" hidden></div>
            </div>
            <p style="margin-top:10px; font-size: 11px; color: var(--cream-muted);">Envie o código gerado para seus jogadores.</p>
        </div>

        <!-- Módulos Futuros (Fase 3+) -->
        <div class="dash-modules">
            <div class="dash-module-card">
                <h3>Personagens</h3>
                <p>O estado dos aventureiros neste mundo.</p>
                <button class="secondary-button" disabled>Em breve</button>
            </div>
            <div class="dash-module-card">
                <h3>Combate</h3>
                <p>Iniciativa, turnos e campo de batalha.</p>
                <button class="secondary-button" disabled>Em breve</button>
            </div>
            <div class="dash-module-card">
                <h3>Mural</h3>
                <p>Avisos, cartazes e mapas do mundo.</p>
                <button class="secondary-button" disabled>Em breve</button>
            </div>
        </div>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=7"></script>
<script src="js/auth.js?v=7"></script>
<script src="js/campanha.js?v=1"></script>

</body>
</html>
