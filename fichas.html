<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeriom — Fichas de Herói</title>
    <!-- Estilos globais do Design System -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Gerenciador de temas (FOUC prevention) -->
    <script src="js/theme.js"></script>
</head>
<body>

    <!-- =========================================================
         TOPBAR (Navegação Superior)
    ========================================================= -->
    <header class="topbar">
        <div class="app-container topbar-content">
            <button class="btn-icon" id="menuButton" aria-label="Abrir menu">☰</button>
            <a href="index.html" class="brand-logo" aria-label="Aeriom Home"></a>
            <div style="display: flex; gap: 8px;">
                <button class="btn-icon" id="openCommandBarBtn" title="Ações Rápidas (Ctrl+K)">⌘</button>
                <button class="btn-icon" id="profileButton" aria-label="Abrir Perfil">♙</button>
            </div>
        </div>
    </header>

    <!-- =========================================================
         MAIN CONTENT: LISTA DE FICHAS
    ========================================================= -->
    <main class="app-container" style="padding-top: 2rem; padding-bottom: 5rem;">
        
        <!-- HEADER DA PÁGINA -->
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: var(--space-lg); flex-wrap: wrap; gap: var(--space-md);">
            <div>
                <h1 style="color: var(--color-primary); margin-bottom: var(--space-xs);">Salão dos Heróis</h1>
                <p class="text-muted">A sua coleção de aventureiros e lendas vivas.</p>
            </div>
            <button id="createCharacterBtn" class="btn btn-primary">+ Forjar Novo Herói</button>
        </div>

        <!-- MENSAGENS GLOBAIS DESTA TELA -->
        <div id="charactersMessage" class="msg-box mb-4"></div>

        <!-- =========================================================
             ESTADOS DA PÁGINA (Arquitetura Consistente)
        ========================================================= -->
        
        <!-- ESTADO 1: LOADING -->
        <div id="loadingCharacters" class="placeholder-panel text-center" style="padding: var(--space-xl);">
            <div class="placeholder-icon" style="font-size: 3rem; margin-bottom: var(--space-md); animation: pulse 1.5s infinite opacity;">⏳</div>
            <h3 style="color: var(--color-primary); margin-bottom: 8px;">A consultar os tomos...</h3>
            <p class="text-muted">A procurar os seus heróis nos registos de Aeriom.</p>
        </div>

        <!-- ESTADO 2: VAZIO (EMPTY STATE) -->
        <div id="emptyCharacters" class="placeholder-panel text-center" style="display: none; padding: var(--space-xl);">
            <div class="placeholder-icon" style="font-size: 3rem; margin-bottom: var(--space-md);">📜</div>
            <h3 style="color: var(--color-primary); margin-bottom: 8px;">Nenhuma Lenda Escrita</h3>
            <p class="text-muted">Ainda não forjou nenhum aventureiro.</p>
            <button class="btn btn-secondary mt-4" id="createFirstCharacterBtn">Forjar o Primeiro Herói</button>
        </div>

        <!-- ESTADO 3: LISTA PREENCHIDA -->
        <div id="charactersList" style="display: none; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-lg);">
            <!-- Os cards das fichas serão injetados aqui via JS -->
        </div>

    </main>

    <!-- =========================================================
         MODAIS GLOBAIS
    ========================================================= -->

    <!-- MODAL: COMMAND BAR (Navegação Rápida) -->
    <div id="commandBarModal" class="modal-backdrop" style="z-index: 10006; align-items: flex-start; padding-top: 15vh;">
        <div class="modal-surface" style="padding: 0;">
            <div style="display: flex; align-items: center; padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--color-border); gap: 12px;">
                <span>🔍</span>
                <input type="text" class="form-input" style="border:none; background:transparent; box-shadow:none; padding:0;" id="commandBarInput" placeholder="Navegação Rápida (ex: 'Início')">
                <div style="font-size: 0.7rem; background: var(--color-surface-hover); padding: 4px 8px; border-radius: var(--radius-sm); color: var(--color-text-muted); font-weight: 600;">ESC</div>
            </div>
            <div style="padding: 0.5rem; max-height: 300px; overflow-y: auto;">
                <a href="index.html" class="sidebar-link"><span class="sidebar-icon">🏠</span> Voltar ao Início</a>
                <a href="campanhas.html" class="sidebar-link"><span class="sidebar-icon">🗺️</span> Campanhas</a>
            </div>
        </div>
    </div>

    <!-- MODAL: PERFIL DO UTILIZADOR -->
    <div id="profilePanel" class="modal-backdrop">
        <div class="modal-surface text-center">
            <button id="closeProfile" class="modal-close">×</button>
            <div style="width: 80px; height: 80px; border-radius: 50%; background: var(--color-surface-hover); margin: 0 auto 1.5rem; border: 1px solid var(--color-border-strong); display: grid; place-items: center; font-size: 2rem; font-family: var(--font-heading); color: var(--color-primary); overflow: hidden;">
                <img id="profileAvatar" src="" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                <span id="profileFallback">♙</span>
            </div>
            <h2 id="profileName" style="margin-bottom: 0.25rem;">Carregando...</h2>
            <p id="profileEmail" class="text-muted mb-4">Aguarde...</p>
            <div class="form-group mb-0">
                <button id="logoutButton" class="btn btn-danger w-full mt-2">Sair da Conta</button>
            </div>
        </div>
    </div>

    <!-- =========================================================
         SCRIPTS
    ========================================================= -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/menu.js"></script>
    
    <!-- Lógica de Fichas (O script blindado e alinhado) -->
    <script src="js/fichas.js"></script>

    <!-- Script Inline da Command Bar -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cmdModal = document.getElementById('commandBarModal');
            const cmdInput = document.getElementById('commandBarInput');
            
            function toggleCommandBar() {
                if(cmdModal.classList.contains('active')) {
                    cmdModal.classList.remove('active');
                    cmdInput.value = '';
                } else {
                    cmdModal.classList.add('active');
                    cmdInput.focus();
                }
            }
            
            document.getElementById('openCommandBarBtn')?.addEventListener('click', toggleCommandBar);
            
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') { 
                    e.preventDefault(); 
                    toggleCommandBar(); 
                }
                if (e.key === 'Escape' && cmdModal.classList.contains('active')) { 
                    toggleCommandBar(); 
                }
            });
        });
    </script>
</body>
</html>
