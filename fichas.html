<!-- fichas.html -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080707"
    >

    <title>Aerion — Minhas Fichas</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<main class="characters-page">

    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <header class="creation-header">

        <button
            id="backButton"
            class="header-button"
            type="button"
            aria-label="Voltar"
        >
            ←
        </button>


        <div class="creation-title">

            <span>AERION</span>

            <h1>Minhas Fichas</h1>

        </div>


        <!--
            O e-mail foi removido.
            Não há mais informações da conta
            aparecendo no cabeçalho.
        -->

    </header>


    <!-- =====================================================
         CONTEÚDO PRINCIPAL
    ====================================================== -->

    <section class="characters-content">

        <!-- =================================================
             TÍTULO
        ================================================== -->

        <div class="characters-heading">

            <div class="characters-heading-text">

                <span class="step-number">
                    AERION
                </span>

                <h2>
                    Seus personagens
                </h2>

                <p>
                    Todas as fichas criadas nesta conta
                    aparecem aqui.
                </p>

            </div>


            <button
                id="newCharacterButton"
                class="primary-button"
                type="button"
            >
                + Nova ficha
            </button>

        </div>


        <!-- =================================================
             CARREGANDO
        ================================================== -->

        <div
            id="loadingCharacters"
            class="characters-message"
        >
            <div class="characters-loader"></div>

            <p>
                Carregando suas fichas...
            </p>
        </div>


        <!-- =================================================
             LISTA DE PERSONAGENS
        ================================================== -->

        <div
            id="charactersList"
            class="characters-grid"
        ></div>


        <!-- =================================================
             NENHUMA FICHA
        ================================================== -->

        <div
            id="emptyCharacters"
            class="characters-message empty-characters"
            hidden
        >

            <div class="empty-characters-icon">
                +
            </div>

            <h3>
                Você ainda não possui fichas.
            </h3>

            <p>
                Crie seu primeiro personagem para
                começar sua aventura.
            </p>

            <button
                id="emptyNewCharacterButton"
                class="primary-button"
                type="button"
            >
                Criar primeira ficha
            </button>

        </div>


    </section>

</main>


<!-- =========================================================
     SUPABASE
========================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script
    src="js/supabase.js?v=3"
></script>

<script
    src="js/auth.js?v=3"
></script>

<script
    src="js/fichas.js?v=2"
></script>

</body>

</html>
