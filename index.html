<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080707">
    <title>Aeriom — Sistema de RPG</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- =========================
         PAINEL DE PERFIL LATERAL
    ========================== -->
    <div id="profilePanel" class="profile-panel">
        <button id="closeProfile" class="profile-close" aria-label="Fechar perfil">×</button>
        <div class="profile-content">
            <img id="profileAvatar" class="profile-avatar" src="" alt="Avatar">
            <h2 id="profileName">Carregando...</h2>
            <p id="profileEmail">Carregando...</p>
            <button id="editProfileButton">Editar perfil</button>
            <button id="logoutButton">Sair da conta</button>
        </div>
    </div>

    <main class="home">

        <!-- =========================
             CABEÇALHO
        ========================== -->
        <header class="header">
            <button class="header-button menu-button menu-btn" id="menuButton" aria-label="Abrir menu">
                ☰
            </button>

            <a href="./" class="header-logo">
                <img src="https://i.ibb.co/d0SnBLcV/Design-sem-nome-20260817-180846-0000.jpg" alt="Aeriom">
            </a>

            <button class="header-button profile-button" id="profileButton" aria-label="Abrir perfil">
                ♙
            </button>
        </header>

        <!-- =========================
             HERO / IMAGEM PRINCIPAL
        ========================== -->
        <section class="hero">
            <img src="https://i.ibb.co/WN2Zh92G/1786964360186.png" alt="Mundo de Aeriom" class="hero-image">
        </section>

        <!-- =========================
             IDENTIDADE
        ========================== -->
        <section class="intro">
            <img src="https://i.ibb.co/qFVJFfQb/Design-sem-nome-20260817-180527-0000.png" alt="Aeriom" class="main-logo">
        </section>

        <!-- =========================
             AÇÕES PRINCIPAIS
        ========================== -->
        <section class="auth-actions" style="width: 100%;">

            <!-- VISÍVEL QUANDO NÃO ESTÁ LOGADO -->
            <div id="loggedOutActions" style="display: flex; flex-direction: column; gap: 15px; width: 100%; align-items: center;">
                <button class="primary-button" id="createAccountButton">
                    <span class="button-icon">◇</span>
                    <span>Criar Conta</span>
                </button>
                <button class="secondary-button" id="loginButton">
                    <span class="button-icon">→</span>
                    <span>Entrar</span>
                </button>
            </div>

            <!-- VISÍVEL QUANDO ESTÁ LOGADO (AQUI ESTÁ A CORREÇÃO DE ESQUELETO!) -->
            <div id="loggedInActions" style="display: none; width: 100%;">
                
                <!-- Essa div vazia de proteção garante que os ícones e textos não fiquem alinhados lado a lado de modo espremido -->
                <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
                    
                    <h2 style="font-family: var(--display-font); color: var(--gold); font-size: 1.8rem; margin-bottom: 5px; text-align: center;">Bem-vindo de volta</h2>
                    <p style="color: var(--cream-muted); font-size: 0.9rem; margin-bottom: 30px; text-align: center;">O seu mundo de aventuras o aguarda.</p>

                    <!-- MENU PREMIUM COM A ESTÉTICA RESTAURADA -->
                    <div class="action-grid">
                        <a href="fichas.html" class="action-card" id="createCharacterButton">
                            <div class="action-icon">◈</div>
                            <h3>Minhas Fichas</h3>
                            <p>Crie, visualize e edite seus heróis.</p>
                        </a>

                        <a href="campanhas.html" class="action-card" id="campaignButton">
                            <div class="action-icon">♟</div>
                            <h3>Campanhas</h3>
                            <p>Acesse sessões como Jogador ou Mestre.</p>
                        </a>
                    </div>

                </div>
            </div>

        </section>
    </main>

    <!-- =========================
         MODAL DE AUTENTICAÇÃO
    ========================== -->
    <div id="authModal" class="auth-modal">
        <div class="auth-box">
            <button id="closeAuth" class="auth-close">×</button>

            <!-- LOGIN -->
            <div id="loginForm">
                <h2>Entrar no Aeriom</h2>
                <p>Escolha como deseja entrar.</p>

                <button id="discordLoginButton" class="auth-discord">
                    🎮 Entrar com Discord
                </button>

                <div class="auth-divider">
                    <span>ou</span>
                </div>

                <input type="email" id="loginEmail" placeholder="E-mail" autocomplete="email">
                <input type="password" id="loginPassword" placeholder="Senha" autocomplete="current-password">

                <button id="emailLoginButton">Entrar</button>
                <button id="showRegisterButton">Criar uma conta</button>
            </div>

            <!-- CADASTRO -->
            <div id="registerForm" style="display: none;">
                <h2>Criar conta</h2>
                <p>Crie sua conta no Aeriom.</p>

                <button id="discordRegisterButton" class="auth-discord">
                    🎮 Criar conta com Discord
                </button>

                <div class="auth-divider">
                    <span>ou</span>
                </div>

                <input type="email" id="registerEmail" placeholder="E-mail" autocomplete="email">
                <input type="password" id="registerPassword" placeholder="Senha" autocomplete="new-password">
                <input type="password" id="registerPasswordConfirm" placeholder="Confirmar senha" autocomplete="new-password">

                <button id="registerButton">Criar conta</button>
                <button id="showLoginButton">Já tenho uma conta</button>
            </div>

            <!-- MENSAGEM DE ERRO/SUCESSO -->
            <p id="authMessage"></p>
        </div>
    </div>

    <!-- =========================
         JAVASCRIPT
    ========================== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js?v=6"></script>
    <script src="js/auth.js?v=6"></script>
    <script src="js/main.js?v=6"></script>
    <script src="js/menu.js?v=1"></script>
</body>
</html>
