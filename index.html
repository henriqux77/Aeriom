<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aerion — Sistema de RPG</title>

    <!-- CSS que será desenvolvido pelo DeepSeek -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="home">

        <!-- =========================
             CABEÇALHO
        ========================== -->
        <header class="header">

            <button
                class="header-button menu-button"
                id="menuButton"
                aria-label="Abrir menu"
            >
                ☰
            </button>

            <a href="/" class="header-logo">
                <img
                    src="assets/aerion-logo.png"
                    alt="Aerion"
                >
            </a>

            <button
                class="header-button profile-button"
                id="profileButton"
                aria-label="Abrir perfil"
            >
                ♙
            </button>

        </header>


        <!-- =========================
             HERO / IMAGEM PRINCIPAL
        ========================== -->
        <section class="hero">

            <img
                src="https://i.ibb.co/WN2Zh92G/1786964360186.png"
                alt="Mundo de Aerion"
                class="hero-image"
            >

        </section>


        <!-- =========================
             IDENTIDADE
        ========================== -->
        <section class="intro">

            <img
                src="assets/aerion-logo.png"
                alt="Aerion"
                class="main-logo"
            >

        </section>


        <!-- =========================
             AÇÕES PRINCIPAIS
        ========================== -->
        <section class="auth-actions">

            <button
                class="primary-button"
                id="createAccountButton"
            >
                <span class="button-icon">◇</span>
                <span>Criar Conta</span>
            </button>

            <button
                class="secondary-button"
                id="loginButton"
            >
                <span class="button-icon">→</span>
                <span>Entrar</span>
            </button>

        </section>


        <!-- =========================
             FUNCIONALIDADES
        ========================== -->
        <section class="features">

            <article class="feature-card">

                <div class="feature-icon">
                    ♟
                </div>

                <h2>Mesas</h2>

                <p>
                    Crie e gerencie suas mesas
                </p>

            </article>


            <article class="feature-card">

                <div class="feature-icon">
                    ◈
                </div>

                <h2>Fichas</h2>

                <p>
                    Crie personagens únicos
                </p>

            </article>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->
    <script src="js/main.js"></script>

</body>
</html>
