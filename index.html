<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aerion — Sistema de RPG</title>

    <!-- CSS que será desenvolvido pelo DeepSeek -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- PERFIL -->
<div id="profilePanel" class="profile-panel">

    <button id="closeProfile" class="profile-close">
        ×
    </button>

    <div class="profile-content">

        <img
            id="profileAvatar"
            class="profile-avatar"
            src=""
            alt="Avatar"
        >

        <h2 id="profileName">
            Carregando...
        </h2>

        <p id="profileEmail">
            Carregando...
        </p>

        <button id="editProfileButton">
            Editar perfil
        </button>

        <button id="logoutButton">
            Sair da conta
        </button>

    </div>

</div>
    <main class="home">

        <!-- =========================
             CABEÇALHO
        ========================== -->
        <header class="header">

            <button
                class="header-button menu-button"
                id="menuButton"
                aria-label="Abrir menu"
            >
                ☰
            </button>

            <a href="/" class="header-logo">
                <img
                    src="https://i.ibb.co/d0SnBLcV/Design-sem-nome-20260817-180846-0000.jpg"
                    alt="Aerion"
                >
            </a>

            <button
                class="header-button profile-button"
                id="profileButton"
                aria-label="Abrir perfil"
            >
                ♙
            </button>

        </header>


        <!-- =========================
             HERO / IMAGEM PRINCIPAL
        ========================== -->
        <section class="hero">

            <img 
                src="https://i.ibb.co/WN2Zh92G/1786964360186.png"
                alt="Mundo de Aerion"
                class="hero-image"
            >

        </section>


        <!-- =========================
             IDENTIDADE
        ========================== -->
        <section class="intro">

            <img
                src="https://i.ibb.co/qFVJFfQb/Design-sem-nome-20260817-180527-0000.png"
                alt="Aerion"
                class="main-logo"
            >

        </section>


        <!-- =========================
             AÇÕES PRINCIPAIS
        ========================== -->
        <section class="auth-actions">

            <button
                class="primary-button"
                id="createAccountButton"
            >
                <span class="button-icon">◇</span>
                <span>Criar Conta</span>
            </button>

            <button
                class="secondary-button"
                id="loginButton"
            >
                <span class="button-icon">→</span>
                <span>Entrar</span>
            </button>

        </section>
<!-- =========================
     AUTENTICAÇÃO
========================== -->

<div id="authModal" class="auth-modal">

    <div class="auth-box">

        <button id="closeAuth" class="auth-close">
            ×
        </button>


        <!-- =========================
             LOGIN
        ========================== -->

        <div id="loginForm">

            <h2>Entrar no Aerion</h2>

            <p>Escolha como deseja entrar.</p>


            <button id="discordLoginButton" class="auth-discord">
                🎮 Entrar com Discord
            </button>


            <div class="auth-divider">
                <span>ou</span>
            </div>


            <input
                type="email"
                id="loginEmail"
                placeholder="E-mail"
                autocomplete="email"
            >


            <input
                type="password"
                id="loginPassword"
                placeholder="Senha"
                autocomplete="current-password"
            >


            <button id="emailLoginButton">
                Entrar
            </button>


            <button id="showRegisterButton">
                Criar uma conta
            </button>

        </div>


        <!-- =========================
             CADASTRO
        ========================== -->

        <div id="registerForm" style="display: none;">

            <h2>Criar conta</h2>

            <p>Crie sua conta no Aerion.</p>


            <button id="discordRegisterButton" class="auth-discord">
                🎮 Criar conta com Discord
            </button>


            <div class="auth-divider">
                <span>ou</span>
            </div>


            <input
                type="email"
                id="registerEmail"
                placeholder="E-mail"
                autocomplete="email"
            >


            <input
                type="password"
                id="registerPassword"
                placeholder="Senha"
                autocomplete="new-password"
            >


            <input
                type="password"
                id="registerPasswordConfirm"
                placeholder="Confirmar senha"
                autocomplete="new-password"
            >


            <button id="registerButton">
                Criar conta
            </button>


            <button id="showLoginButton">
                Já tenho uma conta
            </button>

        </div>


        <!-- MENSAGEM -->

        <p id="authMessage"></p>

    </div>

</div>


        <!-- =========================
             FUNCIONALIDADES
        ========================== -->
        <section class="features">

            <article class="feature-card">

                <div class="feature-icon">
                    ♟
                </div>

                <h2>Mesas</h2>

                <p>
                    Crie e gerencie suas mesas
                </p>

            </article>


            <article class="feature-card">

                <div class="feature-icon">
                    ◈
                </div>

                <h2>Fichas</h2>

                <p>
                    Crie personagens únicos
                </p>

            </article>

        </section>

    </main>

    <!-- =========================
         JAVASCRIPT
    ========================== -->
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=3"></script>
<script src="js/main.js?v=3"></script>

</body>
</html>
